name: CI/CD → GitHub Pages

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

  # Permite disparar o workflow manualmente pela aba Actions
  workflow_dispatch:

# Permissões necessárias para o deploy no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy rode por vez; PRs em fila não cancelam deploys em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1 — Testes
  # Roda em todo push e PR. Valida a aplicação antes de buildar.
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

  # ─────────────────────────────────────────────────────────────
  # Job 2 — Build + Upload do artefato para GitHub Pages
  # Só roda se os testes passarem.
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build estático
        env:
          NODE_ENV: production
          APP_VERSION: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: npm run build

      - name: Verificar artefato gerado
        run: |
          echo "Conteúdo de dist/:"
          ls -la dist/
          echo ""
          echo "build-info.json:"
          cat dist/build-info.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # ─────────────────────────────────────────────────────────────
  # Job 3 — Deploy no GitHub Pages
  # Só roda em push para develop (não em PRs).
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy para GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
